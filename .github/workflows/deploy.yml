# CI/CD del pipeline (requisito 3: orquestación como código).
#
#   Pull request a main -> tests locales con Spark + validación del bundle.
#   Push a main (merge)  -> tests + despliegue del bundle al target prod.
#
# Solo despliega: no corre jobs. Requiere los secretos DATABRICKS_HOST y DATABRICKS_TOKEN.

name: ci-deploy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - run: pytest -q -p no:warnings

  validate:
    runs-on: ubuntu-latest
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: databricks/setup-cli@v1.27.0
      - run: databricks bundle validate --strict -t prod

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [test, validate]
    runs-on: ubuntu-latest
    # Un despliegue a la vez; uno nuevo espera al anterior en lugar de cancelarlo.
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: databricks/setup-cli@v1.27.0
      - run: databricks bundle deploy -t prod
      - run: databricks bundle summary -t prod
