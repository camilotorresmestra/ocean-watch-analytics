# CI/CD del pipeline (requisito 3: orquestación como código).
#
#   Pull request a main -> tests locales con Spark + validación del bundle.
#   Push a main (merge)  -> tests + validación; despliega al target prod solo si la
#                           variable del repo DEPLOY_ENABLED vale "true".
#
# Solo despliega: no corre jobs. Requiere los secretos DATABRICKS_HOST y DATABRICKS_TOKEN.
#
# El despliegue automático está apagado: el workspace institucional no permite tokens
# personales, así que GitHub no tiene cómo autenticarse ahí. Mientras tanto se despliega
# a mano desde un computador con sesión OAuth:
#
#   databricks bundle deploy -t prod -p institucional
#
# Para reactivarlo: credenciales válidas para el workspace en los secretos y
# DEPLOY_ENABLED=true en Settings > Secrets and variables > Actions > Variables.

name: ci-deploy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v7.1.0
        with:
          # 3.11: pyspark 3.5 importa distutils, que Python 3.12 eliminó.
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - run: pytest -q -p no:warnings

  validate:
    runs-on: ubuntu-latest
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: databricks/setup-cli@v1.27.0
      # Sin --strict: el bundle vive en /Workspace/Shared, que todo usuario del workspace puede
      # editar (permiso heredado que no se puede quitar), y strict convierte ese aviso en error.
      # Los jobs y la consola sí quedan restringidos a mine-group3 (permissions en databricks.yml).
      - run: databricks bundle validate -t prod

  deploy:
    if: vars.DEPLOY_ENABLED == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [test, validate]
    runs-on: ubuntu-latest
    # Un despliegue a la vez; uno nuevo espera al anterior en lugar de cancelarlo.
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: databricks/setup-cli@v1.27.0
      - run: databricks bundle deploy -t prod
      - run: databricks bundle summary -t prod
